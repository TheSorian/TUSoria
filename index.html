<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="TUSoria — Transporte Urbano de Soria en tiempo real. Mapa vivo, horarios, paradas y planificador de rutas." />
    <meta name="theme-color" content="#0c1425" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TUSoria — Transporte Urbano de Soria en Tiempo Real</title>
    <script>
      // Safe single-shot recovery from stale ServiceWorker cache.
      // Uses sessionStorage to guarantee at most ONE recovery reload per session.
      (function() {
        var RECOVERED_KEY = 'tusoria_sw_recovered';
        function nukeSW() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
            });
          }
        }
        // 1. If an asset fails to load (hash mismatch from stale cache)
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.includes('/assets/') && !sessionStorage.getItem(RECOVERED_KEY)) {
            sessionStorage.setItem(RECOVERED_KEY, '1');
            nukeSW();
            window.location.reload();
          }
        });
        // 2. If React hasn't mounted after 4 seconds (SW served stale HTML)
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !sessionStorage.getItem(RECOVERED_KEY)) {
            sessionStorage.setItem(RECOVERED_KEY, '1');
            nukeSW();
            window.location.reload();
          }
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
