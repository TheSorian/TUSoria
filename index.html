<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="TUSoria — Transporte Urbano de Soria en tiempo real. Mapa vivo, horarios, paradas y planificador de rutas." />
    <meta name="theme-color" content="#0c1425" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TUSoria — Transporte Urbano de Soria en Tiempo Real</title>
    <script>
      // Single-shot recovery if an old ServiceWorker cached broken JS asset hashes
      window.addEventListener('error', function(e) {
        if (e && e.filename && e.filename.includes('/assets/') && !sessionStorage.getItem('tusoria_sw_recovered')) {
          sessionStorage.setItem('tusoria_sw_recovered', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let reg of regs) reg.unregister();
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (let key of keys) caches.delete(key);
            });
          }
          window.location.reload();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
