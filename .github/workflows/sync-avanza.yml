name: Sync Avanza Soria Schedules & Stops

on:
  schedule:
    # Runs every day at 05:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Sync Script
        run: node scripts/syncAvanzaData.mjs

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No schedule or stop changes detected."
          else
            git commit -m "chore(data): auto-sync schedules & stops from Avanza Soria [skip ci]"
            git push origin main
          fi
